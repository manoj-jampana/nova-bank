<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Banking App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1100px;
            margin: 30px auto;
            padding: 20px;
        }
        h1 {
            font-size: 40px;
        }
        section {
            border: 1px solid #ddd;
            border-radius: 12px;
            padding: 25px;
            margin: 20px 0;
        }
        h2 {
            font-size: 28px;
        }

        input {
            padding: 14px;
            margin-right: 10px;
            margin-bottom: 10px;
            font-size: 16px;
        }
        button {
            padding: 14px 20px;
            font-size: 16px;
            cursor: pointer;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }
        th {
            background: #f2f2f2;
        }
    </style>
</head>

<body>

<h1>🏦 Banking App</h1>

<!-- CREATE ACCOUNT -->
<section>
    <h2>Create Account</h2>

    <input
            id="name"
            type="text"
            placeholder="Holder name"
    >

    <input
            id="email"
            type="email"
            placeholder="Email"
    >

    <input
            id="initial"
            type="number"
            step="0.01"
            placeholder="Initial deposit"
    >

    <button onclick="create()">Create</button>
</section>


<!-- DEPOSIT / WITHDRAW -->
<section>
    <h2>Deposit / Withdraw</h2>

    <input
            id="acc"
            type="text"
            placeholder="Account number"
    >

    <input
            id="amount"
            type="number"
            step="0.01"
            placeholder="Amount"
    >

    <button onclick="money('deposit')">Deposit</button>

    <button onclick="money('withdraw')">Withdraw</button>
</section>


<!-- TRANSFER -->
<section>
    <h2>Transfer</h2>

    <input
            id="from"
            type="text"
            placeholder="From account"
    >

    <input
            id="to"
            type="text"
            placeholder="To account"
    >

    <input
            id="tamount"
            type="number"
            step="0.01"
            placeholder="Amount"
    >

    <button onclick="transfer()">Transfer</button>
</section>


<!-- ACCOUNTS -->
<section>
    <h2>Accounts</h2>

    <table>
        <thead>
        <tr>
            <th>Account Number</th>
            <th>Name</th>
            <th>Email</th>
            <th>Balance</th>
        </tr>
        </thead>

        <tbody id="out"></tbody>
    </table>
</section>


<script>

    const api = '/api';


    async function j(url, opt = {}) {

        let r = await fetch(api + url, {
            headers: {
                'Content-Type': 'application/json'
            },
            ...opt
        });

        let x = await r.json().catch(() => null);

        if (!r.ok) {
            throw Error(x?.message || 'Request failed');
        }

        return x;
    }


    /* CREATE ACCOUNT */

    async function create() {

        try {

            let x = await j('/accounts', {

                method: 'POST',

                body: JSON.stringify({

                    holderName:
                    document.getElementById('name').value,

                    email:
                    document.getElementById('email').value,

                    initialDeposit:
                        Number(document.getElementById('initial').value)

                })

            });

            alert('Account created: ' + x.accountNumber);

            load();

        } catch (e) {

            alert(e.message);

        }
    }


    /* DEPOSIT / WITHDRAW */

    async function money(type) {

        try {

            let account =
                document.getElementById('acc').value;

            let amount =
                document.getElementById('amount').value;

            let x = await j(
                '/accounts/' + account + '/' + type,
                {
                    method: 'POST',

                    body: JSON.stringify({
                        amount: Number(amount)
                    })
                }
            );

            alert('New balance: ' + x.balance);

            load();

        } catch (e) {

            alert(e.message);

        }
    }


    /* TRANSFER */

    async function transfer() {

        try {

            let from =
                document.getElementById('from').value;

            let to =
                document.getElementById('to').value;

            let amount =
                document.getElementById('tamount').value;

            await j('/transfers', {

                method: 'POST',

                body: JSON.stringify({

                    fromAccount: from,

                    toAccount: to,

                    amount: Number(amount)

                })

            });

            alert('Transfer successful');

            load();

        } catch (e) {

            alert(e.message);

        }
    }


    /* LOAD ACCOUNTS */

    async function load() {

        try {

            let accounts = await j('/accounts');

            let out =
                document.getElementById('out');

            out.innerHTML =
                accounts.map(x => `

                <tr>

                    <td>${x.accountNumber}</td>

                    <td>${x.holderName}</td>

                    <td>${x.email}</td>

                    <td>₹ ${x.balance}</td>

                </tr>

            `).join('');

        } catch (e) {

            document.getElementById('out').innerText =
                e.message;
        }
    }


    /* LOAD WHEN PAGE OPENS */

    load();

</script>

</body>
</html>
